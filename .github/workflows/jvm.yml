name: JVM modules

# Unit tests for the pure-Kotlin modules, plus contract tests that execute the
# query builder against a database freshly built by the ETL. The Kotlin
# registry duplicates metric definitions that live in Python; this job is what
# keeps the two from drifting apart.

on:
  push:
    paths:
      - "core/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "etl/**"
      - ".github/workflows/jvm.yml"
  pull_request:
    paths:
      - "core/**"
      - "build-logic/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "etl/**"
      - ".github/workflows/jvm.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt

      - name: Build a stats database for the contract tests
        working-directory: etl
        run: python -m gridiron_etl.build --seasons 2024 2025 --out "$GITHUB_WORKSPACE/build/contract/stats.db"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        env:
          GRIDIRON_STATS_DB: ${{ github.workspace }}/build/contract/stats.db
        run: ./gradlew :core:model:test :core:statquery:test
